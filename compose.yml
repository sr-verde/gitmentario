# Every value below can be overridden in a `.env` file next to this file.
# Anything not set there falls back to the default given here.
services:
  gitmentario:
    build:
      context: "."
    restart: "unless-stopped"
    # Bound to loopback on purpose: Gitmentario enforces no rate or body limits
    # of its own, so it must sit behind a reverse proxy that does. A proxy on the
    # host reaches it here; a proxy container on this compose network reaches the
    # service by name on port 80 instead.
    ports:
      - "127.0.0.1:${GITMENTARIO_PORT:-8000}:80"
    environment:
      CONTENT_DIR: "${CONTENT_DIR:-content}"
      COMMENTS_DIR: "${COMMENTS_DIR:-comments}"
      GIT_PUSH: "${GIT_PUSH:-false}"
      TARGET_BRANCH: "${TARGET_BRANCH:-main}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      FORGE__TYPE: "${FORGE__TYPE:-gitlab}"
      FORGE__BASE_URL: "${FORGE__BASE_URL:?set FORGE__BASE_URL in your .env}"
      FORGE__PROJECT_ID: "${FORGE__PROJECT_ID:?set FORGE__PROJECT_ID in your .env}"
      FORGE__AUTH_TOKEN: "${FORGE__AUTH_TOKEN:?set FORGE__AUTH_TOKEN in your .env}"
